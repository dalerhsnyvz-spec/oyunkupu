<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OyunKüpü — Mucizevi Para</title>
<style>
:root{color-scheme:dark;--gold:#e9c66b;--cream:#f3e7c6}*{box-sizing:border-box}body{margin:0;background:#090b0d;color:var(--cream);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:grid;place-items:center;padding:12px}.game{width:min(100%,760px);min-height:min(94vh,820px);position:relative;overflow:hidden;border:1px solid #554b37;border-radius:12px;background:linear-gradient(#080b10 0 20%,#172027 45%,#0a0c0e 100%);box-shadow:0 0 45px #000;display:flex;flex-direction:column}.top{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #5c5036;background:#08090bd9;z-index:2}.brand{letter-spacing:3px;font:700 12px Arial,sans-serif;color:var(--gold)}.sound{background:#171819;border:1px solid #61553b;color:#e9dfc3;border-radius:20px;padding:7px 11px;font-size:12px}.scene{position:relative;flex:1;min-height:370px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#555044 0,#222522 35%,#0c1013 72%)}.window{position:absolute;left:6%;top:9%;width:27%;height:28%;border:8px solid #302b24;background:linear-gradient(#111d29,#090d12);box-shadow:inset 0 0 24px #000}.window:before,.window:after{content:"";position:absolute;background:#443c2c}.window:before{width:4px;height:100%;left:50%}.window:after{height:4px;width:100%;top:50%}.neon{position:absolute;right:8%;top:12%;font:700 clamp(10px,2.5vw,18px) Arial,sans-serif;letter-spacing:4px;color:#e8b64f;text-shadow:0 0 8px #ffad36,0 0 22px #d36a22;transform:rotate(-3deg)}.counter{position:absolute;bottom:8%;left:-3%;width:106%;height:22%;background:linear-gradient(#514331,#211c17 25%,#100e0d);border-top:5px solid #796044;box-shadow:0 -8px 24px #000}.door{position:absolute;right:8%;top:5%;height:53%;width:20%;background:linear-gradient(90deg,#201c17,#483626,#1a1713);border:5px solid #30251c;transform-origin:right;transition:transform 1s}.door.open{transform:perspective(400px) rotateY(-67deg)}.door:after{content:"";position:absolute;right:12%;top:50%;width:7px;height:7px;background:#c39a52;border-radius:50%}.man{position:absolute;left:50%;bottom:19%;width:120px;height:260px;transform:translateX(-50%) translateY(20px);opacity:0;transition:all 1s;filter:drop-shadow(0 12px 10px #000)}.man.show{opacity:1;transform:translateX(-50%) translateY(0)}.head{position:absolute;top:5px;left:34px;width:53px;height:63px;border-radius:45% 45% 40% 40%;background:linear-gradient(90deg,#8d694c,#c39a73,#76563e);z-index:2}.hair{position:absolute;top:0;left:30px;width:61px;height:28px;border-radius:50% 50% 15% 15%;background:#241b17;z-index:3}.hair:after{content:"";position:absolute;left:8px;top:15px;width:8px;height:30px;background:#241b17;box-shadow:38px 0 #241b17}.eyes{position:absolute;top:30px;left:42px;width:38px;height:3px;background:#211812;z-index:4}.body{position:absolute;top:63px;left:15px;width:91px;height:139px;background:linear-gradient(90deg,#17191a,#393634,#111314);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.shirt{position:absolute;top:64px;left:48px;width:27px;height:86px;background:#d5cbb3;clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);z-index:2}.tie{position:absolute;top:72px;left:57px;width:12px;height:85px;background:#4b2522;clip-path:polygon(50% 0,100% 15%,65% 100%,35% 100%,0 15%);z-index:3}.arm{position:absolute;top:115px;left:79px;width:45px;height:19px;border-radius:10px;background:#a47b58;transform:rotate(13deg);z-index:4}.hand{position:absolute;top:112px;left:103px;width:28px;height:16px;border-radius:50%;background:#b58b65;z-index:5}.coin{position:absolute;top:104px;left:112px;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0a4,#d5a532 50%,#765015);border:2px solid #f5d66f;box-shadow:0 0 14px #e2b13c;z-index:6}.coin.flip{animation:flip 1.5s ease-in-out 2}@keyframes flip{0%{transform:translateY(0) rotateY(0) scale(1)}50%{transform:translateY(-145px) rotateY(720deg) scale(1.25)}100%{transform:translateY(0) rotateY(1440deg) scale(1)}}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 30%,#0009 100%)}.dialog{padding:20px 18px 18px;background:linear-gradient(#121313,#080909);border-top:1px solid #4c402c;z-index:2}.eyebrow{font:11px Arial,sans-serif;letter-spacing:2px;color:#b59a5d;margin-bottom:10px}.line{font-size:clamp(17px,4vw,22px);line-height:1.45;min-height:66px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.btn{flex:1;min-width:115px;padding:13px 12px;border:1px solid #92733b;border-radius:4px;background:#c49b4b;color:#17120a;font:700 13px Arial,sans-serif;letter-spacing:1px}.btn.secondary{background:#191919;color:#e6d7b1;border-color:#5b503d}.btn:disabled{opacity:.45}.result{position:absolute;inset:0;z-index:8;background:#020202;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;animation:fadein .8s}.result.show{display:flex}@keyframes fadein{from{opacity:0}to{opacity:1}}.result h1{font:900 clamp(38px,10vw,64px) Arial,sans-serif;letter-spacing:5px;margin:0 0 18px;color:#eee}.result p{font-size:19px;line-height:1.5;max-width:450px}.result .btn{flex:none;width:min(100%,260px);margin-top:16px}.footer{text-align:center;padding:8px;font:10px Arial,sans-serif;color:#746b58;letter-spacing:1px;background:#080909}@media(max-height:650px){.scene{min-height:300px}.man{transform:translateX(-50%) scale(.8);transform-origin:bottom center}.man.show{transform:translateX(-50%) translateY(0) scale(.8)}.dialog{padding:12px}}
</style>
</head>
<body><main class="game"><header class="top"><div class="brand">OYUNKÜPÜ</div><button class="sound" id="sound">SES: AÇIK</button></header><section class="scene"><div class="window"></div><div class="neon">OPEN 24 HOURS</div><div class="door" id="door"></div><div class="man" id="man"><div class="hair"></div><div class="head"></div><div class="eyes"></div><div class="body"></div><div class="shirt"></div><div class="tie"></div><div class="arm"></div><div class="hand"></div><div class="coin" id="coin"></div></div><div class="counter"></div><div class="vignette"></div></section><section class="dialog"><div class="eyebrow" id="eyebrow">GECE • BENZİN İSTASYONU</div><div class="line" id="line">İçerisi sessiz. Dışarıda rüzgâr tabelayı sallıyor.</div><div class="actions" id="actions"><button class="btn" id="next">BAŞLA</button></div></section><div class="result" id="result"><h1 id="resultTitle">ÖLDÜN</h1><p id="resultText"></p><button class="btn" id="again">YENİDEN DOĞ</button></div><footer class="footer">HER ŞANSIN BİR BEDELİ VARDIR</footer></main>
<script>
(()=>{const $=id=>document.getElementById(id);let step=-1,soundOn=true,audio=null,locked=false;const lines=["İyi akşamlar. Merak etme, uzun sürmeyecek. Ben de burada yaşlanmak istemiyorum.","İnsanlar zamanın para olduğunu söyler. Güzel söz. Ama ben henüz zamanı kasada bozdurabilen birine rastlamadım.","Bu küçük şeyin iki yüzü var. İnsanların da öyle… Gerçi insanların kaç yüzü olduğunu saymak daha uzun sürüyor.","Rahat ol. Acele etmiyorum. Sadece beklemekten nefret ediyorum.","Sana bir şans vereceğim. Yazı mı, tura mı?"];function beep(freq=90,duration=.25){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.stop(audio.currentTime+duration)}catch(e){}}$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='SES: '+(soundOn?'AÇIK':'KAPALI');if(soundOn)beep(160,.1)};function reset(){step=-1;locked=false;$('door').classList.remove('open');$('man').classList.remove('show');$('coin').classList.remove('flip');$('result').classList.remove('show');$('eyebrow').textContent='GECE • BENZİN İSTASYONU';$('line').textContent='İçerisi sessiz. Dışarıda rüzgâr tabelayı sallıyor.';$('actions').innerHTML='<button class="btn" id="next">BAŞLA</button>';$('next').onclick=advance}function advance(){if(locked)return;step++;if(step===0){$('door').classList.add('open');beep(65,.4);setTimeout(()=>$('man').classList.add('show'),350);$('line').textContent='Bir adam kapıdan giriyor. Üzerindeki palto istasyonun ışığında neredeyse siyah.';$('eyebrow').textContent='KAPI AÇILDI'}else if(step<=5){$('line').textContent=lines[step-1];$('eyebrow').textContent=step===5?'SEÇİMİNİ YAP':'YABANCI';beep(80+step*12,.16)}if(step<5){$('actions').innerHTML='<button class="btn" id="next">DEVAM ET</button>';$('next').onclick=advance}else{$('actions').innerHTML='<button class="btn" id="heads">YAZI</button><button class="btn secondary" id="tails">TURA</button>';$('heads').onclick=()=>play('YAZI');$('tails').onclick=()=>play('TURA')}}function play(choice){if(locked)return;locked=true;$('actions').innerHTML='';$('eyebrow').textContent='PARA HAVADA';$('line').textContent='Adam parayı havaya atıyor. Metalin sesi odadaki sessizliği kesiyor.';$('coin').classList.add('flip');beep(180,.15);setTimeout(()=>{const outcome=Math.random()<.5?'YAZI':'TURA';$('result').classList.add('show');if(choice===outcome){$('resultTitle').textContent=outcome+' — DOĞRU';$('resultText').textContent='Demek bugün şansın mesaiye kalmış. Pek sık rastlanan bir şey değil.';beep(440,.35)}else{$('resultTitle').textContent='ÖLDÜN';$('resultText').textContent='Kısa bir ses duyulur. Ekran kararır. İstasyondaki ışıklar yeniden yanar; bir şans daha.';beep(48,.8)}},3100)}$('next').onclick=advance;$('again').onclick=reset})();
</script></body></html>
